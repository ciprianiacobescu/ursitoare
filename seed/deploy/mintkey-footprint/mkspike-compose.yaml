# M9 spike: Mintkey data plane ONLY (postgres + liquibase + vault-adapter + broker + proxy-plugin).
# Derived from ~/gooseProjects/mintkey/infra/compose/docker-compose.yml (read-only source), with:
#   - project name mkspike, own network and volumes, no container_name keys
#   - every depends_on on admin-api / kong / seed-job / keycloak removed
#   - host ports only in 19000-19099, bound to 127.0.0.1
#   - NO secrets in this file: every secret is ${VAR} from .runtime/mkspike.env (generated by gen-secrets.sh)
# Run:  docker compose -p mkspike --env-file .runtime/mkspike.env -f mkspike-compose.yaml up -d
name: mkspike

volumes:
  pg_data:
  broker_wal:
  proxy_wal:
  vault_sqlite:
  broker_nopg_wal:
  proxy_nopg_wal:

networks:
  mkspike:
    driver: bridge

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 512m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_DB: mintkey
      POSTGRES_USER: mintkey_migrate
      POSTGRES_PASSWORD: ${MKSPIKE_PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:19010:5432"
    networks: [mkspike]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mintkey_migrate -d mintkey"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Migrations: the SAME 29 Liquibase changesets the full stack runs (read-only bind mount of the source tree).
  liquibase:
    image: liquibase/liquibase:4.27.0
    restart: "no"
    mem_limit: 256m
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mintkey
      LIQUIBASE_COMMAND_USERNAME: mintkey_migrate
      LIQUIBASE_COMMAND_PASSWORD: ${MKSPIKE_PG_PASSWORD}
    command:
      - --changeLogFile=changelog/db.changelog-master.yaml
      - update
      - -Ddb_app_password=${MKSPIKE_DB_APP_PASSWORD}
      - -Ddb_subscriber_password=${MKSPIKE_DB_SUBSCRIBER_PASSWORD}
    volumes:
      - ${MKSPIKE_CHANGELOG_DIR:-${HOME}/gooseProjects/mintkey/apps/admin-api/db/changelog}:/liquibase/changelog:ro
    networks: [mkspike]
    depends_on:
      postgres:
        condition: service_healthy

  vault-adapter:
    image: mintkey-vault-adapter:latest
    restart: unless-stopped
    mem_limit: ${MKSPIKE_VAULT_MEM:-128m}   # 128m = the stock compose value; raised via env for the concurrency test
    environment:
      MINTKEY_ENV: dev
      MINTKEY_VAULT_KEK: ${MKSPIKE_VAULT_KEK}
      VAULT_GRPC_PORT: "8084"
      VAULT_HTTP_PORT: "8087"
      MINTKEY_VAULT_BACKEND: postgres
      MINTKEY_VAULT_PG_DSN: postgres://mintkey_app:${MKSPIKE_DB_APP_PASSWORD}@postgres:5432/mintkey?sslmode=disable
      MINTKEY_VAULT_PROXY_IDENTITY_ID: svcid_proxy
      MINTKEY_VAULT_PROXY_TOKEN: ${MKSPIKE_VAULT_PROXY_TOKEN}
      GOMEMLIMIT: ${MKSPIKE_VAULT_GOMEMLIMIT:-}   # empty = unset (Go treats empty as no limit)
    ports:
      - "127.0.0.1:19084:8084"
      - "127.0.0.1:19087:8087"
    networks: [mkspike]
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/grpc_health_probe", "-addr=:8084"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  broker:
    image: mintkey-broker:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MINTKEY_ENV: dev
      BROKER_HTTP_PORT: "8083"
      VAULT_GRPC_ADDR: vault-adapter:8084
      DATABASE_URL: postgres://mintkey_app:${MKSPIKE_DB_APP_PASSWORD}@postgres:5432/mintkey
      MINTKEY_BROKER_SIGNING_KEY_FILE: /run/mkspike/signing.seed
      MINTKEY_MCP_SERVICE_TOKEN: ${MKSPIKE_MCP_SERVICE_TOKEN}
      MINTKEY_PROXY_SERVICE_TOKEN: ${MKSPIKE_PROXY_SERVICE_TOKEN}
      MINTKEY_BROKER_SERVICE_TOKEN: ${MKSPIKE_BROKER_SERVICE_TOKEN}
      # No admin-api in this stack: audit events are retried 5x then dead-lettered. Pointed at the (optional) audit-sink stub on the host.
      MINTKEY_ADMIN_API_URL: ${MKSPIKE_AUDIT_URL:-http://admin-api-absent:8080}
    volumes:
      - broker_wal:/var/lib/mintkey
      - ./.runtime/signing.seed:/run/mkspike/signing.seed:ro
    ports:
      - "127.0.0.1:19083:8083"
    networks: [mkspike]
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://localhost:8083/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  proxy-plugin:
    image: mintkey-proxy-plugin:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MINTKEY_ENV: dev
      BROKER_ADDR: broker:8083
      VAULT_GRPC_ADDR: vault-adapter:8084
      PLUGIN_PORT: "8086"
      MINTKEY_PROXY_SERVICE_TOKEN: ${MKSPIKE_PROXY_SERVICE_TOKEN}
      DATABASE_URL: postgres://mintkey_app:${MKSPIKE_DB_APP_PASSWORD}@postgres:5432/mintkey
      MINTKEY_AUD_ENFORCEMENT: permissive
      MINTKEY_ADMIN_API_URL: ${MKSPIKE_AUDIT_URL:-http://admin-api-absent:8080}
      MINTKEY_VAULT_PROXY_IDENTITY_ID: svcid_proxy
      MINTKEY_VAULT_PROXY_TOKEN: ${MKSPIKE_VAULT_PROXY_TOKEN}
    volumes:
      - proxy_wal:/var/lib/mintkey
    ports:
      - "127.0.0.1:19086:8086"
    networks: [mkspike]
    depends_on:
      broker:
        condition: service_healthy
      vault-adapter:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------------------------------------
  # OPTIONAL profile "kong": the stock Kong 3.6 ingress in front of proxy-plugin, DB-less, static route (stretch test).
  # ---------------------------------------------------------------------------------------------------------
  kong:
    profiles: ["kong"]
    image: kong:3.6
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
      KONG_NGINX_WORKER_PROCESSES: "2"
    volumes:
      - ./kong-static.yml:/etc/kong/kong.yml:ro
    ports:
      - "127.0.0.1:19000:8000"
    networks: [mkspike]
    depends_on:
      proxy-plugin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kong health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------------------------------------
  # OPTIONAL profile "nopg": the three Go services with NO Postgres at all (vault-adapter on its SQLite backend,
  # broker/proxy without DATABASE_URL). Different host ports, separate WAL/vault volumes. (stretch test)
  # ---------------------------------------------------------------------------------------------------------
  vault-adapter-sqlite:
    profiles: ["nopg"]
    image: mintkey-vault-adapter:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MINTKEY_ENV: dev
      MINTKEY_VAULT_KEK: ${MKSPIKE_VAULT_KEK}
      VAULT_GRPC_PORT: "8084"
      VAULT_HTTP_PORT: "8087"
      MINTKEY_VAULT_BACKEND: sqlite
      MINTKEY_VAULT_FILE_PATH: /var/lib/mintkey/vault.sqlite
      MINTKEY_VAULT_PROXY_IDENTITY_ID: svcid_proxy
      MINTKEY_VAULT_PROXY_TOKEN: ${MKSPIKE_VAULT_PROXY_TOKEN}
    volumes:
      - vault_sqlite:/var/lib/mintkey
    ports:
      - "127.0.0.1:19088:8084"
    networks: [mkspike]
    healthcheck:
      test: ["CMD", "/grpc_health_probe", "-addr=:8084"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  broker-nopg:
    profiles: ["nopg"]
    image: mintkey-broker:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MINTKEY_ENV: dev
      BROKER_HTTP_PORT: "8083"
      MINTKEY_BROKER_SIGNING_KEY_FILE: /run/mkspike/signing.seed
      MINTKEY_MCP_SERVICE_TOKEN: ${MKSPIKE_MCP_SERVICE_TOKEN}
      MINTKEY_PROXY_SERVICE_TOKEN: ${MKSPIKE_PROXY_SERVICE_TOKEN}
      MINTKEY_BROKER_SERVICE_TOKEN: ${MKSPIKE_BROKER_SERVICE_TOKEN}
      MINTKEY_ADMIN_API_URL: ${MKSPIKE_AUDIT_URL:-http://admin-api-absent:8080}
    volumes:
      - broker_nopg_wal:/var/lib/mintkey
      - ./.runtime/signing.seed:/run/mkspike/signing.seed:ro
    ports:
      - "127.0.0.1:19089:8083"
    networks:
      mkspike:
        aliases: [broker-nopg]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://localhost:8083/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  proxy-plugin-nopg:
    profiles: ["nopg"]
    image: mintkey-proxy-plugin:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MINTKEY_ENV: dev
      BROKER_ADDR: broker-nopg:8083
      VAULT_GRPC_ADDR: vault-adapter-sqlite:8084
      PLUGIN_PORT: "8086"
      MINTKEY_PROXY_SERVICE_TOKEN: ${MKSPIKE_PROXY_SERVICE_TOKEN}
      MINTKEY_AUD_ENFORCEMENT: permissive
      MINTKEY_ADMIN_API_URL: ${MKSPIKE_AUDIT_URL:-http://admin-api-absent:8080}
      MINTKEY_VAULT_PROXY_IDENTITY_ID: svcid_proxy
      MINTKEY_VAULT_PROXY_TOKEN: ${MKSPIKE_VAULT_PROXY_TOKEN}
    volumes:
      - proxy_nopg_wal:/var/lib/mintkey
    ports:
      - "127.0.0.1:19090:8086"
    networks: [mkspike]
    depends_on:
      broker-nopg:
        condition: service_healthy
      vault-adapter-sqlite:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
