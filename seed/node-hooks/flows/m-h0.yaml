# generated by tests/gen-flows.mjs: H0 no hooks
ursitoare: 0.2-draft
flow: m-h0
version: 1.0.0
description: Extract an incoming invoice, decide, get approval when needed, pay, and archive through n8n.
inputs:
  type: object
  properties:
    invoice_id:
      type: string
  required:
    - invoice_id
start: fetch_invoice
nodes:
  fetch_invoice:
    kind: block
    uses: invoices.get@1
    with:
      invoice_id: ${{ inputs.invoice_id }}
    next: extract
  extract:
    kind: llm.extract
    input:
      text: ${{ nodes.fetch_invoice.output.raw_text }}
    instructions: Extract the vendor name, the total amount, the currency and the due date from the invoice text.
    output_schema:
      type: object
      properties:
        vendor_name:
          type: string
        amount:
          type: number
        currency:
          type: string
        due_date:
          type: string
      required:
        - vendor_name
        - amount
        - currency
    next: lookup_vendor
  lookup_vendor:
    kind: block
    uses: erp.lookup_vendor@1
    with:
      vendor_name: ${{ nodes.extract.output.vendor_name }}
    next: normalize
  normalize:
    kind: code
    language: js
    input:
      amount: ${{ nodes.extract.output.amount }}
      currency: ${{ nodes.extract.output.currency }}
    source: |
      return {
        amount: Math.round(input.amount * 100) / 100,
        currency: input.currency.toUpperCase(),
        is_large: input.amount > 1000
      };
    output_schema:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
        is_large:
          type: boolean
      required:
        - amount
        - currency
        - is_large
    next: classify
  classify:
    kind: llm.decide
    input:
      vendor_status: ${{ nodes.lookup_vendor.output.status }}
      amount: ${{ nodes.normalize.output.amount }}
      is_large: ${{ nodes.normalize.output.is_large }}
    instructions: Reject blocked vendors. Send large amounts for review. Auto-approve the rest.
    outcomes:
      - auto_approve
      - needs_review
      - reject
    cases:
      auto_approve: pay
      needs_review: approval
      reject: notify_rejection
  approval:
    kind: human.approval
    assignee_role: finance-approver
    summary: Approve payment of ${{ nodes.normalize.output.amount }} ${{ nodes.normalize.output.currency }} to ${{ nodes.extract.output.vendor_name }}?
    timeout: PT48H
    cases:
      approved: pay
      rejected: notify_rejection
      timeout: notify_rejection
  pay:
    kind: block
    uses: erp.create_payment@1
    with:
      vendor_id: ${{ nodes.lookup_vendor.output.vendor_id }}
      amount: ${{ nodes.normalize.output.amount }}
      currency: ${{ nodes.normalize.output.currency }}
      reference: ${{ inputs.invoice_id }}
    next: archive
  archive:
    kind: delegate
    target: n8n
    workflow: archive-invoice
    with:
      invoice_id: ${{ inputs.invoice_id }}
      payment_id: ${{ nodes.pay.output.payment_id }}
    callback_timeout: PT1H
    next: done
    on_timeout: done
  notify_rejection:
    kind: block
    uses: mail.send@1
    with:
      to: ap@example.com
      subject: Invoice ${{ inputs.invoice_id }} rejected
      body: Rejected by policy or by the reviewer.
    next: rejected
  done:
    kind: end
    status: completed
    output:
      payment_id: ${{ nodes.pay.output.payment_id }}
  rejected:
    kind: end
    status: completed
