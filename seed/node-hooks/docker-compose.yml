# NH: Postgres 18 for the DBOS system database. Project name: us-hk (docker compose -p us-hk up -d)
services:
  postgres:
    image: postgres:18
    container_name: us-hk-postgres
    restart: "no"
    environment:
      POSTGRES_USER: dbos
      POSTGRES_PASSWORD: dbos-spike-local
      POSTGRES_DB: ursitoare
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - us_hk_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbos -d ursitoare"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  us_hk_pgdata:
