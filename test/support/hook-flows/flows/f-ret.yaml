# generated by tests/gen-flows.mjs: S05a post retry succeeds
ursitoare: 0.2-draft
flow: f-ret
version: 1.0.0
inputs:
  type: object
  properties:
    query:
      type: string
  required:
    - query
start: search
nodes:
  search:
    kind: block
    uses: kb.search@1
    with:
      query: ${{ inputs.query }}
      top_k: 1
    next: done
    post:
      - id: enough_passages
        kind: code
        source: |
          if (ctx.output.passages.length < 2) return { action: 'retry', input: { ...ctx.input, top_k: 2 }, feedback: 'need 2 passages' };
        max_retries: 2
  done:
    kind: end
    status: completed
    output:
      passages: ${{ nodes.search.output.passages }}
