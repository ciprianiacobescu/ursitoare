# expect: L3_TAINT_TO_CONSEQUENTIAL
# note: untrusted content inside a template
ursitoare: "0.1"
flow: fixture
version: 1.0.0
inputs:
  type: object
  properties:
    url:
      type: string
    email:
      type: string
    amount:
      type: number
    count:
      type: integer
    flag:
      type: boolean
    ids:
      type: array
      items:
        type: string
  required:
    - url
    - email
    - amount
    - count
    - flag
    - ids
start: fetch
nodes:
  fetch:
    kind: block
    uses: docs.fetch@1
    with:
      url: ${{ inputs.url }}
    next: send
  done:
    kind: end
    status: completed
  send:
    kind: block
    uses: mail.send@1
    with:
      to: ops@example.com
      subject: Digest
      body: "Fetched: ${{ nodes.fetch.output.content }}"
    next: done
