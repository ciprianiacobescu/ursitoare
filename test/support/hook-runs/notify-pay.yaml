ursitoare: "0.1"
flow: notify-pay
version: 1.0.0
inputs:
  type: object
  properties:
    vendor: { type: string }
    invoice: { type: string }
    amount: { type: number }
  required: [vendor, invoice, amount]
start: lookup
nodes:
  lookup:
    kind: block
    uses: erp.lookup_vendor@1
    with:
      vendor_name: "${{ inputs.vendor }}"
    next: route
  route:
    kind: switch
    on: "${{ nodes.lookup.output.status }}"
    cases:
      active: pay
    default: rejected
  pay:
    kind: block
    uses: erp.create_payment@1
    with:
      vendor_id: "${{ nodes.lookup.output.vendor_id }}"
      amount: "${{ inputs.amount }}"
      currency: EUR
      reference: "${{ inputs.invoice }}"
    next: done
    post:
      - id: notify
        kind: block
        uses: slack.post_message@1
        with:
          channel: "#ap"
          text: "${{ hook.node.id }} paid ${{ nodes.pay.output.payment_id }}"
  done:
    kind: end
    status: completed
    output:
      payment_id: "${{ nodes.pay.output.payment_id }}"
  rejected:
    kind: end
    status: failed
